  <text x="48" y="267" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">❯ ls stack/</text>
  <text x="48" y="299" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">frontend/</text>
  <text x="160" y="299" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">React · JS · Tailwind · Bootstrap</text>
  
