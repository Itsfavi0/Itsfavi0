  <path d="M48 166H604" stroke="#30363D"/>
  
  <text x="48" y="196" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">context:</text>
  <text x="166" y="196" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Lima, Perú (UNAC)</text>
  
