<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Favio Brañez — Systems Engineering Student</title>
  <desc id="desc">A professional technical terminal profile card with Favio Brañez's location, mission and full-stack focus.</desc>
  <defs>
    <linearGradient id="tech-grad" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo Base -->
  <rect width="960" height="390" rx="18" fill="#0D1117"/>
  <!-- Borde degradado técnico -->
  <rect x="9" y="9" width="942" height="372" rx="13" fill="none" stroke="url(#tech-grad)" stroke-width="2"/>
  
  <!-- Botones de ventana -->
  <circle cx="35" cy="35" r="5" fill="#FF5F56"/>
  <circle cx="54" cy="35" r="5" fill="#FFBD2E"/>
  <circle cx="73" cy="35" r="5" fill="#27C93F"/>
  <text x="98" y="41" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Itsfavi0  ·  bash  ·  80x24</text>
  <path d="M29 58H931" stroke="#30363D"/>

  <!-- Panel Izquierdo: Terminal -->
  <rect x="29" y="78" width="594" height="271" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
